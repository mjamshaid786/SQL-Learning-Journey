10. FINAL CHALLENGE

Create a clean customer report:

Return:

customer_id
clean_name
clean_city
clean_email
phone
signup_month
signup_year
total_spent

query = SELECT 
customer_id,
COALESCE(INITCAP(TRIM(customer_name)), 'unknown') AS clean_name,
COALESCE(INITCAP(TRIM(city)), 'unknown') AS clean_city,
COALESCE(TRIM(LOWER(email)), 'no_email@example.com') AS clean_email,
COALESCE(TRIM(phone), 'no_phone') AS phone,
EXTRACT (MONTH FROM signup_date) AS signup_month,
EXTRACT (YEAR FROM signup_date) AS signup_year,
total_spent
FROM customers

;
